version: '3.8'

services:
  app:
    image: aspendigital/octobercms:latest
    volumes:
      - ./plugins/rikki:/var/www/html/plugins/rikki
      - ./themes/:/var/www/html/themes
    restart: unless-stopped

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    environment:
      - DB_TYPE=mysql
      - DB_HOST=mysql #DB_HOST should match the service name of the database container
      - DB_DATABASE=octobercms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - CMS_DISABLE_CORE_UPDATES=false

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: mysql:8.0
    volumes:
      - ./hl_test_data_dump_05_2024.sql:/docker-entrypoint-initdb.d/datadump.sql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=octobercms

    # Add "forwardPorts": ["3306"] to **devcontainer.json** to forward MariaDB locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
